<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente vibrante inspirado na presença do YouTube e Google -->
    <linearGradient id="codeOnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#D90026" />
    </linearGradient>
  </defs>

  <!-- Fundo transparente; o formato da tela/badge preenche a aba com máxima presença -->
  <rect x="20" y="44" width="472" height="424" rx="108" fill="url(#codeOnGrad)" />

  <!-- Símbolo Code ON: < ▶ > (Código + Play/Música) -->
  <!-- Bracket Esquerdo < -->
  <path
    d="M 148 184 L 90 256 L 148 328"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Play Central ▶ (Geometria fluida com vértices suaves) -->
  <path
    d="M 206 186 C 206 174 219 166 230 173 L 310 243 C 319 250 319 262 310 269 L 230 339 C 219 346 206 338 206 326 Z"
    fill="#FFFFFF"
  />

  <!-- Bracket Direito > -->
  <path
    d="M 364 184 L 422 256 L 364 328"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
