<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo escuro conforme a imagem de referência -->
  <rect width="512" height="512" fill="#000000" />
  
  <!-- 
    Caminho (path) da forma branca central:
    M: Move para o ponto inicial (topo esquerdo)
    C: Curva de Bézier Cúbica (cria o topo suave)
    L: Linha reta até a base direita
    C: Curva de Bézier Cúbica (arredonda o "pé" direito)
    Q: Curva Quadrática (cria o arco interno côncavo da base)
    C: Curva de Bézier Cúbica (arredonda o "pé" esquerdo)
    Z: Fecha o caminho de volta ao topo
  -->
  <path d="
    M 226 150
    C 238 120, 274 120, 286 150
    L 366 330
    C 382 366, 350 398, 318 382
    Q 256 340, 194 382
    C 162 398, 130 366, 146 330
    Z" 
    fill="#ffffff" 
  />
</svg>