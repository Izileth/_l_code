<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    LYRIC STUDIO — Favicon
    Concept: "Code Waveform" — 5 terminal-block bars forming an audio
    spectrum fingerprint. Reads as "music beat" at a glance and as
    "bar chart / code blocks" at close range. Inspired by Vercel's
    approach: solid matte dark bg, single-color white mark, geometric
    precision, no gradients. Legible at 16×16, 32×32, 180×180.

    Grid: 32×32 — bars occupy x=4 to x=28, baseline at y=28.
  -->

  <!-- Matte dark background -->
  <rect width="32" height="32" rx="6" fill="#0d0d0d"/>

  <!-- Waveform bars (heights reflect a musical phrase rhythm) -->
  <!-- Bar 1 -->
  <rect x="4"  y="20" width="4" height="8"  rx="1" fill="#ffffff"/>
  <!-- Bar 2 -->
  <rect x="10" y="12" width="4" height="16" rx="1" fill="#ffffff"/>
  <!-- Bar 3 -->
  <rect x="16" y="16" width="4" height="12" rx="1" fill="#ffffff"/>
  <!-- Bar 4 -->
  <rect x="22" y="6"  width="4" height="22" rx="1" fill="#ffffff"/>
  <!-- Bar 5 -->
  <rect x="28" y="14" width="2" height="14" rx="1" fill="#ffffff" opacity="0.55"/>

  <!-- Baseline hairline — references code/terminal underline convention -->
  <rect x="4" y="29.5" width="26" height="1" rx="0.5" fill="#ffffff" opacity="0.25"/>
</svg>
